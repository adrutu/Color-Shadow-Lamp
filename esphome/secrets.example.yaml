# Copy to secrets.yaml (next to color-shadow-lamp.yaml, or in your ESPHome config folder)
# and fill in your own values. secrets.yaml is in .gitignore.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"
# 32 random bytes, base64. Generate one: https://esphome.io/components/api/#configuration-variables
# or run: openssl rand -base64 32
lamp_api_key: "paste-a-base64-key-here"
lamp_ota_password: "choose-an-ota-password"
lamp_ap_password: "choose-a-fallback-hotspot-password"
